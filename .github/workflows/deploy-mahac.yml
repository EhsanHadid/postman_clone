name: Deploy Mahac

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional API/web image tag. Leave blank to keep the chart value."
        required: false
        type: string
      desktop_download_url:
        description: "Optional desktop app download URL. Leave blank to use the latest GitHub release asset."
        required: false
        type: string
  workflow_run:
    workflows: ["Desktop Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-mahac
  cancel-in-progress: false

env:
  DEFAULT_DEPLOY_PATH: postman_clone/helm/postman-clone

jobs:
  deploy:
    name: Deploy to Mahac Kubernetes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve image tag
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail

          image_tag="${INPUT_IMAGE_TAG}"
          if [ -z "${image_tag}" ] && [ "${WORKFLOW_NAME}" = "Desktop Release" ]; then
            image_tag="${WORKFLOW_HEAD_SHA}"
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Wait for matching Docker image build
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 45); do
            run_status="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs?event=push&head_sha=${WORKFLOW_HEAD_SHA}&per_page=100" |
              jq -r '
                .workflow_runs
                | map(select(.name == "Docker Push"))
                | sort_by(.created_at)
                | reverse
                | .[0]
                | if . == null then "" else "\(.status)\t\(.conclusion // "")" end
              '
            )"

            status="$(printf '%s' "${run_status}" | cut -f1)"
            conclusion="$(printf '%s' "${run_status}" | cut -f2)"

            if [ "${status}" = "completed" ] && [ "${conclusion}" = "success" ]; then
              echo "Docker Push succeeded for ${WORKFLOW_HEAD_SHA}."
              exit 0
            fi

            if [ "${status}" = "completed" ]; then
              echo "Docker Push completed with conclusion: ${conclusion}" >&2
              exit 1
            fi

            echo "Waiting for Docker Push for ${WORKFLOW_HEAD_SHA} (attempt ${attempt}/45)."
            sleep 20
          done

          echo "Timed out waiting for Docker Push for ${WORKFLOW_HEAD_SHA}." >&2
          exit 1

      - name: Resolve desktop download URL
        id: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DESKTOP_DOWNLOAD_URL: ${{ github.event.inputs.desktop_download_url || '' }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail

          release_url="https://api.github.com/repos/${REPOSITORY}/releases/latest"
          if [ "${WORKFLOW_NAME}" = "Desktop Release" ] && [[ "${WORKFLOW_HEAD_BRANCH}" == v* ]]; then
            release_url="https://api.github.com/repos/${REPOSITORY}/releases/tags/${WORKFLOW_HEAD_BRANCH}"
          fi

          if [ -n "${INPUT_DESKTOP_DOWNLOAD_URL}" ]; then
            desktop_download_url="${INPUT_DESKTOP_DOWNLOAD_URL}"
          else
            desktop_download_url="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${release_url}" |
              jq -r '
                .assets
                | map(select(.name | test("(?i)(windows|win).*x64.*\\.exe$|\\.exe$")))
                | .[0].browser_download_url // empty
              '
            )"
          fi

          if [ -z "${desktop_download_url}" ]; then
            echo "No desktop .exe asset was found for ${release_url}." >&2
            exit 1
          fi

          echo "desktop_download_url=${desktop_download_url}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_HOST}" ]; then
            echo "Missing DEPLOY_SSH_HOST secret." >&2
            exit 1
          fi

          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "Missing DEPLOY_SSH_KEY secret." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT}" "${DEPLOY_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy Helm chart over SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || env.DEFAULT_DEPLOY_PATH }}
          DESKTOP_APP_DOWNLOAD_URL: ${{ steps.desktop.outputs.desktop_download_url }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_USER}" ]; then
            echo "Missing DEPLOY_SSH_USER secret." >&2
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SSH_PORT}" "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DESKTOP_APP_DOWNLOAD_URL='${DESKTOP_APP_DOWNLOAD_URL}' IMAGE_TAG='${IMAGE_TAG}' DEPLOY_RUN_ID='${DEPLOY_RUN_ID}' bash -s" <<'EOF'
          set -euo pipefail

          export KUBECONFIG=~/.kube/config
          cd "${DEPLOY_PATH}"

          helm_args=(
            upgrade --install postman-clone .
            -f values-mahac.yaml
            -n postman-clone
            --create-namespace
            --set-string "api.env.DESKTOP_APP_DOWNLOAD_URL=${DESKTOP_APP_DOWNLOAD_URL}"
            --set-string "api.podAnnotations.deploy-run-id=${DEPLOY_RUN_ID}"
            --set-string "web.podAnnotations.deploy-run-id=${DEPLOY_RUN_ID}"
          )

          if [ -n "${IMAGE_TAG}" ]; then
            helm_args+=(
              --set-string "api.image.tag=${IMAGE_TAG}"
              --set-string "web.image.tag=${IMAGE_TAG}"
            )
          fi

          helm dependency update
          helm "${helm_args[@]}"
          EOF
