name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expectedTag = "${{ steps.version.outputs.version_tag }}"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag $actualTag does not match package.json version $expectedTag"
          }

      - name: Build shared packages
        run: yarn build:packages

      - name: Build web renderer
        run: yarn workspace @postman-clone/web build

      - name: Build desktop main process
        run: yarn workspace @postman-clone/desktop build

      - name: Copy renderer into desktop app
        run: yarn workspace @postman-clone/desktop copy-renderer

      - name: Package Windows installer
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          node node_modules/electron-builder/out/cli/cli.js `
            --projectDir apps/desktop `
            --win nsis `
            --x64 `
            --config.directories.output=release-desktop

      - name: Rename release files
        id: files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = "apps/desktop/release-desktop"
          $artifactDir = "desktop-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $installer = Get-ChildItem $releaseDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1

          if (-not $installer) {
            throw "No Windows installer .exe was produced in $releaseDir"
          }

          $installerName = "Postman-Clone-Desktop-v$version-Windows-x64.exe"
          Copy-Item $installer.FullName (Join-Path $artifactDir $installerName)

          $blockmap = Get-ChildItem $releaseDir -Filter "*.exe.blockmap" -File | Select-Object -First 1
          if ($blockmap) {
            Copy-Item $blockmap.FullName (Join-Path $artifactDir "$installerName.blockmap")
          }

          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "artifact_dir=$artifactDir" >> $env:GITHUB_OUTPUT

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-clone-desktop-v${{ steps.version.outputs.version }}-windows-x64
          path: ${{ steps.files.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Postman Clone Desktop ${{ github.ref_name }}
          files: ${{ steps.files.outputs.artifact_dir }}/*
          fail_on_unmatched_files: true
          generate_release_notes: true
